<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8ecd3" />
  <meta name="robots" content="noindex" />
  <title>Sei offline — Basex Pizza</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;max-width:100%;overflow-x:hidden;background:#f8ecd3;color:#2b1a0e;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom))}
    p.k{font-size:.75rem;letter-spacing:.4em;text-transform:uppercase;color:#c45c26;margin:0}
    h1{font-size:1.6rem;margin:1rem 0 .5rem}
    p{max-width:28rem;line-height:1.5;opacity:.85}
    button{margin-top:1.5rem;min-height:48px;padding:0 1.5rem;border:0;border-radius:.5rem;background:#c45c26;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <p class="k">Basex Pizza</p>
    <h1>Sei offline</h1>
    <p>Non c'è connessione e questa pagina non è stata salvata sul dispositivo. Riprova appena sei di nuovo online.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
